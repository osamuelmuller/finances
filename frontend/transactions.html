<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transações - Finances</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">   
    <link rel="stylesheet" href="css/pages/transactions.css">
</head>
<body>
    <main>
        <header class="topbar"></header>

        <div class="interface">
            <header class="page--header">
                <div class="page--title">
                    <h1>Histórico de <span>Transações</span></h1>
                    <p>Visualize e gerencia todas as suas transações financeiras.</p>
                </div>

                <button class="btn primary--btn">+ Nova transação</button>
            </header>

            <section class="card filters--section">
                <input type="search" class="input--search" name="search" id="search" placeholder="Buscar por descrição, categoria, etc...">
                <input type="month" class="input--month" name="calendar" id="calendar">
                <select class="select--input" name="category" id="category-selection">
                    <option value="all-categories" class="select--option" selected disabled>Todas as categorias</option>
                    <option value="alimentacao" class="select--option">Alimentação</option>
                    <option value="transporte" class="select--option">Transporte</option>
                    <option value="renda" class="select--option">Renda</option>
                    <option value="lazer" class="select--option">Lazer</option>
                    <option value="saude" class="select--option">Saúde</option>
                    <option value="Moradia" class="select--option">Moradia</option>
                </select>
                <select class="select--input" name="payment-method" id="payment-method-selection">
                    <option value="tranferencia" class="select--option">Transferência</option>
                    <option value="pix" class="select--option">Pix</option>
                    <option value="credito" class="select--option">Crédito</option>
                    <option value="debito" class="select--option">Débito</option>
                </select>
                <button class="btn tertiary--btn" type="reset">Limpar filtros</button>
            </section>

            <article class="card balance-summary">
                <div class="balance-card">
                    <div class="icon border-circle" style="background-color: var(--color-green);"></div>
                    <div class="balance-infos">
                        <p>Total de entradas</p>
                        <span>R$ 4.850,00</span>
                    </div>
                </div>
                <div class="balance-card">
                    <div class="icon border-circle" style="background-color: var(--color-red);"></div>
                    <div class="balance-infos">
                        <p>Total de saídas</p>
                        <span>R$ 2.474,68</span>
                    </div>
                </div>
                <div class="balance-card">
                    <div class="icon border-circle" style="background-color: var(--color-blue);"></div>
                    <div class="balance-infos">
                        <p>Saldo do período</p>
                        <span>R$ 2.375,32</span>
                    </div>
                </div>
            </article>

            <!-- create table here -->
        </div>
    </main>
</body>
</html>
