<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transações - Finances</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">   
    <link rel="stylesheet" href="css/pages/transactions.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <main>
        <header class="topbar">
            <div style="display: flex; align-items: center; justify-content: space-between; height: 100%; padding: 0 var(--spacing-xl);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="images/finances-logo.png" alt="Finances" width="32" height="32">
                    <span style="font-weight: 700; color: var(--color-primary); font-size: 1.1rem;">Finances</span>
                </div>
                <nav style="display: flex; gap: var(--spacing-large);">
                    <a href="index.html" style="color: var(--color-text-secondary); text-decoration: none; font-weight: 500;">Início</a>
                    <a href="transactions.html" style="color: var(--color-primary); text-decoration: none; font-weight: 600;">Transações</a>
                </nav>
            </div>
        </header>

        <div class="interface">
            <header class="page--header">
                <div class="page--title">
                    <h1>Histórico de <span>Transações</span></h1>
                    <p>Visualize e gerencie todas as suas transações financeiras.</p>
                </div>

                <button class="btn primary--btn" id="btn-new-transaction">+ Nova transação</button>
            </header>

            <section class="card filters--section">
                <input type="search" class="input--search" name="search" id="search" placeholder="Buscar por descrição, categoria, etc...">
                <input type="month" class="input--month" name="calendar" id="calendar">
                <select class="select--input" name="category" id="category-selection">
                    <option value="" selected>Todas as categorias</option>
                </select>
                <select class="select--input" name="payment-method" id="payment-method-selection">
                    <option value="" selected>Todas as formas de pagamento</option>
                </select>
                <button class="btn tertiary--btn" id="btn-clear-filters" type="button">Limpar filtros</button>
            </section>

            <article class="card balance-summary">
                <div class="balance-card">
                    <div class="icon border-circle" style="background-color: var(--color-green);"></div>
                    <div class="balance-infos">
                        <p>Total de entradas (Orçamento)</p>
                        <span id="total-period-income">R$ 0,00</span>
                    </div>
                </div>
                <div class="balance-card">
                    <div class="icon border-circle" style="background-color: var(--color-red);"></div>
                    <div class="balance-infos">
                        <p>Total de saídas</p>
                        <span id="total-period-expense" class="danger">R$ 0,00</span>
                    </div>
                </div>
                <div class="balance-card">
                    <div class="icon border-circle" style="background-color: var(--color-blue);"></div>
                    <div class="balance-infos">
                        <p>Saldo do período</p>
                        <span id="total-period-balance">R$ 0,00</span>
                    </div>
                </div>
            </article>

            <table class="table">
                <thead>
                    <tr class="table--header">
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Forma de pagamento</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="transactions-table-body">
                    <tr>
                        <td colspan="7" class="state-loading">Carregando transações da API...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="js/transactions.js"></script>
</body>
</html>
