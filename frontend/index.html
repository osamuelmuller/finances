<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finances</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    
    <!-- 
    ====================================
    MAIN DIV
    ====================================
    -->
    <div class="app">

        <!-- 
        ====================================
        SIDEBAR MENU
        ====================================
        -->
        <aside class="sidebar">
            <div class="logo">
                <img src="images/finances-logo.png" alt="finances-logo" width="45" height="45">
                <span class="logo-name">Finances</span>
            </div>

            <nav class="sidebar-menu">
                <!-- anchor elements -->
                <a href="" class="nav-link">Início</a>
                <a href="" class="nav-link">Transações</a>
                <a href="" class="nav-link">Categorias</a>
                <a href="" class="nav-link">Formas de Pagamento</a>
                <a href="" class="nav-link">Fontes de Renda</a>
                <a href="" class="nav-link">Relatórios</a>
                <a href="" class="nav-link">Configurações</a>
            </nav>

            <div class="sidebar-quote">
                <!-- quote element -->
                <span class="quote">
                    "Pequenas decisões financeiras hoje, grandes conquistas amanhã."
                </span>
            </div>
        </aside>

        <!-- 
        ====================================
        MAIN CONTENT
        ====================================
        -->
        <main class="main-content">

            <!-- 
            ====================================
            TOPBAR HTML
            ====================================
            -->
            <section class="topbar">
                <div class="topbar-spacer"></div>

                <div class="topbar-options">
                    <button class="notifications-button">
                        <!-- notification icon -->
                    </button>

                    <button class="user-options">
                        <div class="profile-picture">
                            <!-- img icon -->
                        </div>
                        
                        <span class="profile-name">Samuel</span>

                        <span class="profile-dropdown">v</span>
                    </button>
                </div>
            </section>

            <!-- 
            ====================================
            MAIN SCREEN
            ====================================
            -->
            <section class="dashboard">

                <header class="page-header">
                    <div class="page-title">
                        <p class="greeting">Olá, <span class="username">Samuel!</span></p>
                        <p class="greeting-text">Aqui está um resumo das suas finanças.</p>
                    </div>

                    <button class="month-selection">
                        <span class="calendar-icon">calendar icon</span>
                        <span>Setembro de 2026</span>
                        <span class="arrow">v</span>
                    </button>
                </header>

                <!-- 
                ====================================
                CATEGORIES OVERVIEW
                ====================================
                -->
                <section class="categories-overview"><p>test</p></section>

                <!-- 
                ====================================
                DASHBOARD GRID
                ====================================
                -->    
                <section class="dashboard-grid">
    
                    <section class="categories-card"><p>test</p></section>

                    <section class="transactions-card"><p>test</p></section>

                </section>

            </section>
        </main>

    </div>

</body>
</html>
