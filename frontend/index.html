<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finances</title>
</head>
<body>
    
    <!-- 
    ====================================
    MAIN DIV
    ====================================
    -->
    <div class="app">

        <!-- 
        ====================================
        SIDEBAR MENU
        ====================================
        -->
        <aside class="sidebar">
            <div class="logo">
                <!-- logo img element -->
                <span class="logo-name">Finances</span>
            </div>

            <nav class="sidebar-menu">
                <!-- anchor elements -->
            </nav>

            <div class="sidebar-quote">
                <!-- quote element -->
            </div>
        </aside>

        <!-- 
        ====================================
        MAIN CONTENT
        ====================================
        -->
        <main class="main-content">

            <!-- 
            ====================================
            TOPBAR HTML
            ====================================
            -->
            <section class="topbar">
                <div class="topbar-spacer"></div>

                <div class="topbar-options">
                    <button class="notifications-button">
                        <!-- notification icon -->
                    </button>

                    <button class="user-options">
                        <div class="profile-picture">
                            <!-- img icon -->
                        </div>
                        
                        <span class="profile-name">Samuel</span>

                        <span class="profile-dropdown">v</span>
                    </button>
                </div>
            </section>

            <!-- 
            ====================================
            MAIN SCREEN
            ====================================
            -->
            <section class="dashboard">

                <header class="page-header">
                    <div class="page-title">
                        <p>Olá, Samuel!</p>
                        <p>Aqui está um resumo das suas finanças.</p>
                    </div>

                    <button class="month-selection">
                        <span class="calendar-icon">calendar icon</span>
                        <span>Setembro de 2026</span>
                        <span class="arrow">v</span>
                    </button>
                </header>

                <!-- 
                ====================================
                CATEGORIES OVERVIEW
                ====================================
                -->
                <section class="categories-overview"></section>

                <!-- 
                ====================================
                DASHBOARD GRID
                ====================================
                -->    
                <section class="dashboard-grid">
    
                    <section class="categories-card"></section>

                    <section class="transactions-card"></section>

                </section>

            </section>
        </main>

    </div>

</body>
</html>
